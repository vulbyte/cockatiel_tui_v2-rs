[package]
name = "cockatiel-tui-v2"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "16120ab927d35c14baf059d5be7d5c6bb37d78bc" }
ratatui = "0.29"
crossterm = "0.28"
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local-time parsing/formatting for the stream-manager schedule field
# (`Local::now`, `NaiveDateTime`). Nothing else in the TUI needs a time crate.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4", "v7"] }
tokio = { version = "1", features = ["full"] }
open = "5"
rustls = "0.23"
rustls-pemfile = "2"
